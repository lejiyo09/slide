# AI 중계 서버(Cloudflare Worker) 배포
# 필요한 GitHub 설정 (저장소 Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OPENAI_API_KEY, AI_ACCESS_CODE
#   Variables: (선택) AI_ALLOWED_ORIGINS — 기본값 https://<소유자>.github.io
#              (선택) AI_ALLOWED_MODELS  — 예: gpt-5,gpt-image-1 (기본 * = 제한 없음)
# OpenAI 키는 Worker의 비밀 값으로만 올라가며, GitHub Pages에 배포되는 앱 파일에는 들어가지 않습니다.
name: Deploy AI proxy (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/ai-proxy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CODE: ${{ secrets.AI_ACCESS_CODE != '' }}
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: 설정 확인
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 AI 중계 서버 배포를 건너뜁니다. proxy/README.md를 참고하세요."
      - name: 접근 코드 확인
        if: env.HAS_TOKEN == 'true' && env.HAS_CODE != 'true'
        run: |
          echo "::error::AI_ACCESS_CODE 시크릿이 없습니다. 공개 사이트에서 누구나 내 OpenAI 요금을 쓰지 않도록 접근 코드를 정하세요 (정말 필요 없으면 값을 none으로)."
          exit 1
      - name: OpenAI 키 확인
        if: env.HAS_TOKEN == 'true' && env.HAS_KEY != 'true'
        run: |
          echo "::error::OPENAI_API_KEY 시크릿이 없습니다."
          exit 1
      - name: 단위 테스트
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npx vitest run proxy
      - name: Worker 배포
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACCESS_CODE: ${{ secrets.AI_ACCESS_CODE }}
          ALLOWED_ORIGINS: ${{ vars.AI_ALLOWED_ORIGINS || format('https://{0}.github.io', github.repository_owner) }}
          ALLOWED_MODELS: ${{ vars.AI_ALLOWED_MODELS || '*' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          wranglerVersion: '4.151.3'
          # 첫 배포에서도 비밀 값을 올릴 수 있도록 Worker를 먼저 만든 뒤(비밀 값 없음 → 요청은 모두 거절됨) 비밀 값 업로드 → 다시 배포
          preCommands: wrangler deploy
          secrets: |
            OPENAI_API_KEY
            ACCESS_CODE
            ALLOWED_ORIGINS
            ALLOWED_MODELS
